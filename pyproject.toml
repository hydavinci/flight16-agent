[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-matlab-agent"
version = "0.1.0"
description = "A local LangChain agent with controlled MATLAB Engine tools"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "langsmith>=0.3,<1",
    "openai>=1.100,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "mypy>=1.15", "build>=1.2", "playwright>=1.50,<2"]

[project.scripts]
flight-agent = "flight_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flight_agent = ["static/*", "matlab_support/*.m"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["matlab: requires an installed and licensed MATLAB with compatible Engine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["matlab", "matlab.*"]
ignore_missing_imports = true
